<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian · Amoeba — 영어 1:1 강사용 진화형 노트</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Left ribbon -->
    <nav id="ribbon">
      <button class="ribbon-btn active" data-view="vault" title="볼트 (노트)">📝</button>
      <button class="ribbon-btn" data-view="graph" title="그래프 뷰">🕸️</button>
      <button class="ribbon-btn" data-view="amoeba" title="아메바 시스템">🧬</button>
      <button class="ribbon-btn" data-view="students" title="학생">🎓</button>
      <div class="ribbon-spacer"></div>
      <button class="ribbon-btn" id="btn-import" title="볼트 가져오기 (.md 파일들)">📥</button>
      <button class="ribbon-btn" id="btn-export" title="내보내기 (JSON 백업)">💾</button>
      <button class="ribbon-btn" id="btn-help" title="도움말">❓</button>
    </nav>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <input id="search" type="search" placeholder="검색 (제목·내용·태그)…" autocomplete="off" />
      </div>
      <div class="sidebar-toolbar">
        <button id="btn-new-note" title="새 노트">＋ 노트</button>
        <select id="filter-student" title="학생 필터">
          <option value="">전체 학생</option>
        </select>
      </div>
      <div id="file-tree" class="file-tree"></div>
    </aside>

    <!-- Main workspace -->
    <main id="workspace">
      <!-- Vault / editor view -->
      <section id="view-vault" class="view active">
        <div class="editor-bar">
          <div id="breadcrumb" class="breadcrumb"></div>
          <div class="editor-actions">
            <button id="btn-toggle-mode" title="편집/미리보기 전환">👁 미리보기</button>
            <button id="btn-delete-note" class="danger" title="노트 삭제">🗑</button>
          </div>
        </div>
        <div class="editor-split">
          <textarea id="editor" spellcheck="false" placeholder="# 노트 제목&#10;&#10;여기에 마크다운으로 작성하세요. [[다른노트]] 로 링크할 수 있습니다.&#10;&#10;프론트매터 예시:&#10;---&#10;student: Jiwon Park&#10;category: grammar&#10;tags: [present-perfect, articles]&#10;strength: 0.7&#10;---"></textarea>
          <div id="preview" class="preview markdown"></div>
        </div>
        <div id="backlinks" class="backlinks"></div>
      </section>

      <!-- Graph view -->
      <section id="view-graph" class="view">
        <div class="panel-bar">
          <strong>🕸️ 그래프 뷰</strong>
          <span class="hint">노드: 노트 · 선: 위키링크 / 공유 태그 · 색: 학생</span>
          <span class="spacer"></span>
          <label><input type="checkbox" id="graph-show-tags" checked /> 태그 연결</label>
        </div>
        <canvas id="graph-canvas"></canvas>
      </section>

      <!-- Amoeba view -->
      <section id="view-amoeba" class="view">
        <div class="panel-bar">
          <strong>🧬 아메바 시스템</strong>
          <select id="amoeba-student"></select>
          <span class="spacer"></span>
          <button id="btn-evolve">▶ 진화 (다음 세대)</button>
          <button id="btn-evolve-reset" class="ghost" title="처음 세대로">⟲</button>
        </div>
        <div class="amoeba-layout">
          <canvas id="amoeba-canvas"></canvas>
          <div id="amoeba-side" class="amoeba-side"></div>
        </div>
        <div class="amoeba-timeline">
          <label>세대 <span id="gen-label">0</span></label>
          <input type="range" id="gen-slider" min="0" max="0" value="0" step="1" />
          <div id="gen-events" class="gen-events"></div>
        </div>
      </section>

      <!-- Students view -->
      <section id="view-students" class="view">
        <div class="panel-bar">
          <strong>🎓 학생</strong>
          <span class="spacer"></span>
          <button id="btn-new-student">＋ 학생 추가</button>
        </div>
        <div id="students-grid" class="students-grid"></div>
      </section>
    </main>
  </div>

  <!-- Help modal -->
  <div id="modal-help" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" data-close>✕</button>
      <div id="help-content" class="markdown"></div>
    </div>
  </div>

  <input type="file" id="file-input" multiple accept=".md,.markdown,.json" style="display:none" />

  <script src="js/markdown.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/amoeba.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/amoebaView.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
